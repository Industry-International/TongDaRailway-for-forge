# 发布构建：打 tag 时自动构建并上传 JAR 到 GitHub Release
name: Release Build

# 触发条件：仅当创建 以 v 开头的标签（如 v1.0、v2.1.3）时自动执行
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须给 write 权限，才能上传到 Release

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      # 上传 JAR 到 GitHub Actions 产物（保留90天）
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: build/libs/*.jar
          retention-days: 90

      # 【核心】自动把构建好的 JAR 上传到 GitHub Release
      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
