# This workflow will build a Java project with Gradle
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-java-with-gradle

name: Java CI with Gradle

# 触发条件：push / PR / 手动触发
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # ✅ 新增：手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      # 上传构建产物 JAR
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: build/libs/*.jar
          retention-days: 30
